[project]
name = "govor-ai"
version = "0.1.0"
description = "Privacy-first local English teaching host for a Bulgarian learner"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "certifi==2026.10.19",
  "cryptography==50.0.2",
  "fastapi==0.142.4",
  "httpx==0.28.1",
  "jsonschema==4.25.1",
  "pydantic==2.11.9",
  "pydantic-settings==2.11.0",
  "segno==1.6.6",
  "uvicorn[standard]==0.37.0",
]

[project.optional-dependencies]
media = [
  "aiortc==1.15.0",
  "av==14.2.0",
  "numpy==2.3.3",
]
speech = [
  "kokoro-onnx==0.6.1",
  "piper-tts[alignment]==1.8.0",
]

[dependency-groups]
dev = [
  "mypy==1.18.2",
  "pip-audit==2.9.0",
  "pre-commit==4.3.0",
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "pytest-cov==7.0.0",
  "ruff==0.13.3",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = [
  "apps/launcher/tests",
  "apps/host/tests",
  "packages/domain/tests",
  "packages/gateway_security/tests",
  "packages/progress/tests",
  "packages/scene_planner/tests",
  "services/local_ai/tests",
  "services/provider_router/tests",
  "services/speech/tests",
  "tests/contracts",
  "tests/integration",
]
pythonpath = [
  "apps/launcher/src",
  "apps/host/src",
  "packages/domain/src",
  "packages/gateway_security/src",
  "packages/provider_interfaces/src",
  "packages/progress/src",
  "packages/scene_planner/src",
  "packages/contracts/python",
  "services/local_ai/src",
  "services/provider_router/src",
  "services/speech/src",
  "services/media/src",
]
markers = [
  "hardware: requires physical hardware and is never satisfied by a mock",
  "integration: crosses process or module boundaries",
]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [
  ".cache",
  ".tools",
  ".venv",
  "apps/renderer/.godot",
  "apps/android/build",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "S"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
files = [
  "apps/launcher/src",
  "apps/host/src",
  "packages/domain/src",
  "packages/gateway_security/src",
  "packages/provider_interfaces/src",
  "packages/progress/src",
  "packages/scene_planner/src",
  "packages/contracts/python",
  "services/local_ai/src",
  "services/provider_router/src",
  "services/speech/src",
]
plugins = ["pydantic.mypy"]

[tool.coverage.run]
branch = true
omit = [
  # End-user Windows process/ACL/job orchestration is exercised by the packaged-runtime smoke.
  "apps/launcher/src/govor_launcher/cli.py",
  "apps/launcher/src/govor_launcher/processes.py",
  "apps/launcher/src/govor_launcher/security.py",
  # Developer-only patch authoring plus the PowerShell transaction have dedicated integration tests.
  "apps/launcher/src/govor_launcher/application_patch.py",
  # Executed only in a child process; the parent integration test verifies its WAV result.
  "services/speech/src/govor_speech/espeak_worker.py",
  # Thin Win32 FFI is verified by the Milestone 7 real Credential Manager smoke.
  "services/provider_router/src/govor_provider_router/windows_credentials.py",
]
source = [
  "apps/launcher/src",
  "apps/host/src",
  "packages/domain/src",
  "packages/gateway_security/src",
  "packages/provider_interfaces/src",
  "packages/progress/src",
  "packages/scene_planner/src",
  "packages/contracts/python",
  "services/local_ai/src",
  "services/provider_router/src",
  "services/speech/src",
]

[tool.coverage.report]
show_missing = true
fail_under = 85
