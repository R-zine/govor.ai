repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-json
      - id: check-yaml
      - id: check-toml
      - id: check-xml
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: trailing-whitespace
      - id: detect-private-key
      - id: check-added-large-files
        args: ["--maxkb=1024"]
        exclude: ^apps/renderer/Assets/Teacher/Ara/(elena|amira|daniel)\.glb$
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.13.3
    hooks:
      - id: ruff-check
        args: ["--fix"]
      - id: ruff-format
  - repo: local
    hooks:
      - id: powershell-syntax
        name: PowerShell syntax
        entry: powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/check-powershell-syntax.ps1
        language: system
        files: \.ps1$
        pass_filenames: true
        require_serial: true
      - id: affected-tests
        name: Tests for affected applications
        entry: powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/pre-commit-tests.ps1 -Staged
        language: system
        pass_filenames: true
        require_serial: true
        always_run: true
