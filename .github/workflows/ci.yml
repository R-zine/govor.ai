name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.30"
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --dev --extra speech --frozen
      - name: Python lint, types, tests, and coverage
        run: ./scripts/test.ps1 -Scope python
        env:
          PYTEST_ADDOPTS: --cov-report=xml
      - run: uv run --frozen --extra speech pip-audit --cache-dir .cache/pip-audit

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: gradle/actions/wrapper-validation@v4
      - uses: gradle/actions/setup-gradle@v4
      - working-directory: apps/android
        run: ./gradlew :core:test :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --no-daemon

  csharp:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
          cache: true
          cache-dependency-path: packages/contracts/csharp/**/packages.lock.json
      - run: dotnet restore packages/contracts/csharp/Govor.Contracts.Tests/Govor.Contracts.Tests.csproj --locked-mode
      - run: dotnet test packages/contracts/csharp/Govor.Contracts.Tests/Govor.Contracts.Tests.csproj --no-restore

  media-loopback:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.30"
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --dev --extra media --frozen
      - name: Media types and real loopback tests
        run: ./scripts/test.ps1 -Scope media

  renderer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.30"
          enable-cache: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - uses: actions/cache@v4
        with:
          path: |
            .cache/godot
            .tools/godot
          key: godot-4.7.2-stable-mono-windows
      - run: ./scripts/bootstrap.ps1 -IncludeRenderer
      - run: ./scripts/test.ps1 -Scope godot
      - run: ./scripts/build.ps1 -Target renderer

  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.30"
      - run: uv python install 3.12
      - run: uv sync --dev --frozen
      # The path-aware hook is Windows-local; the dedicated jobs above already run every suite.
      - run: uv run pre-commit run --all-files
        env:
          SKIP: affected-tests,powershell-syntax
